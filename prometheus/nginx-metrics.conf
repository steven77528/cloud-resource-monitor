# Run this proxy on the cloud-monitor host. Replace both documentation IPs.
# 192.0.2.10: the cloud-monitor host's private interface address.
# 192.0.2.20: the Prometheus server's actual source address at this proxy.
# Add this server block inside Nginx's http context.
# This HTTP example is for a trusted private network; use TLS across untrusted networks.
server {
    listen 192.0.2.10:18082;
    server_name _;

    location = /metrics {
        allow 192.0.2.20;
        deny all;
        limit_except GET { deny all; }

        proxy_pass http://127.0.0.1:18080/metrics;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
